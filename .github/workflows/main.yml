name: Build AegisCore
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Compile C++ Code
      run: |
        cl /nologo /EHsc /MT /W4 /DUNICODE /D_UNICODE /utf-8 main.cpp /link /SUBSYSTEM:WINDOWS /OUT:AegisCore.exe user32.lib gdi32.lib advapi32.lib shell32.lib comctl32.lib
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AegisCore-App
        path: AegisCore.exe
